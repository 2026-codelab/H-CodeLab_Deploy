# H-CodeLab 운영 스택. 서버의 /home/codelab/hcl 에서 실행한다.
# 비밀값과 서버별 설정은 같은 폴더의 .env 에서 읽는다 (.env.example 참고).
# 주의: 'docker compose down -v' 는 DB 볼륨까지 지우므로 절대 쓰지 않는다.
name: hcl

# judgehost 공통 설정. 개수를 늘릴 때는 아래 services 의 judgehost-N 블록을 복사한다.
x-judgehost: &judgehost
  image: domjudge/judgehost:9.0.0
  restart: unless-stopped
  privileged: true
  cgroup: host
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup
  depends_on:
    domserver:
      condition: service_healthy
  networks: [hcl-net]

x-judgehost-env: &judgehost-env
  DOMSERVER_BASEURL: http://domserver/domjudge/   # domserver WEBAPP_BASEURL 과 맞춘다
  JUDGEDAEMON_USERNAME: judgehost
  JUDGEDAEMON_PASSWORD: ${JUDGEDAEMON_PASSWORD:-not-set-yet}
  CONTAINER_TIMEZONE: Asia/Seoul

services:
  # ---------- 화면 + 리버스 프록시 ----------
  # 서버에 직접 설치한 nginx(80/443, HTTPS)가 이 포트로 넘겨준다. 서버 밖에서는 직접 접속할 수 없다.
  nginx:
    image: hcl-frontend:latest
    restart: unless-stopped
    cpuset: "${SYSTEM_CPUS}"
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [hcl-net]

  # ---------- 애플리케이션 ----------
  backend:
    image: hcl-backend:latest
    restart: unless-stopped
    cpuset: "${SYSTEM_CPUS}"
    environment:
      TZ: Asia/Seoul
      DB_URL: jdbc:mariadb://web-db:3306/handongjudge
      DB_USERNAME: handongjudge_user
      DB_PASSWORD: ${WEB_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FRONTEND_URL: ${SITE_URL}
      COOKIE_SECURE: ${COOKIE_SECURE}
      DOMJUDGE_URL: http://domserver/domjudge
      DOMJUDGE_ID: ${DOMJUDGE_API_USER}
      DOMJUDGE_PW: ${DOMJUDGE_API_PASSWORD:-not-set-yet}
      # 힌트용 LLM: 연구실 로컬 LLM(vLLM)만 쓴다
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ai.walab.info/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-lab-llm}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-unused}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-unused}
      SSH_TUNNEL_ENABLED: "false"
      # 메일은 선택 기능이라 헬스체크에서 뺀다 (Gmail 미설정·장애로 배포가 실패하지 않도록)
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      # 테스트하기 경량 실행기. domjudge 면 기존 경로, runner 면 모든 분반이 실행기를 쓴다
      TESTRUN_EXECUTOR: ${TESTRUN_EXECUTOR:-domjudge}
      TESTRUN_SERVICE_URL: http://testrun-service:8090
      TESTRUN_SERVICE_TOKEN: ${TESTRUN_SERVICE_TOKEN:-}
      TESTRUN_INTERNAL_TOKEN: ${TESTRUN_INTERNAL_TOKEN:-}
    volumes:
      - backend_logs:/var/log/handongjudge
    depends_on:
      web-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [hcl-net]

  web-db:
    image: mariadb:10.11
    restart: unless-stopped
    cpuset: "${SYSTEM_CPUS}"
    environment:
      TZ: Asia/Seoul
      MARIADB_ROOT_PASSWORD: ${WEB_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: handongjudge
      MARIADB_USER: handongjudge_user
      MARIADB_PASSWORD: ${WEB_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - web_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [hcl-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    cpuset: "${SYSTEM_CPUS}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [hcl-net]

  # ---------- DOMjudge ----------
  domserver:
    build: ./domserver
    image: hcl-domserver:9.0.0
    restart: unless-stopped
    cpuset: "${SYSTEM_CPUS}"
    environment:
      CONTAINER_TIMEZONE: Asia/Seoul
      MYSQL_HOST: dom-db
      MYSQL_DATABASE: domjudge
      MYSQL_USER: domjudge
      MYSQL_PASSWORD: ${DOM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DOM_DB_ROOT_PASSWORD}
      # 관리자 화면을 https://<사이트>/domjudge/ 로 연다 (nginx 가 전달)
      WEBAPP_BASEURL: /domjudge
      # nginx 컨테이너(도커 내부망)를 프록시로 신뢰해서 https 와 실제 접속 IP 를 알게 한다
      TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
    ports:
      - "127.0.0.1:12345:80"   # 서버 안에서 직접 확인용 (http://localhost:12345/domjudge/)
    volumes:
      - domserver_etc:/opt/domjudge/domserver/etc
    depends_on:
      dom-db:
        condition: service_healthy
    networks: [hcl-net]

  dom-db:
    image: mariadb:10.11
    restart: unless-stopped
    cpuset: "${SYSTEM_CPUS}"
    environment:
      TZ: Asia/Seoul
      MARIADB_ROOT_PASSWORD: ${DOM_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: domjudge
      MARIADB_USER: domjudge
      MARIADB_PASSWORD: ${DOM_DB_PASSWORD}
    command: --max-connections=1000 --max-allowed-packet=512M
    volumes:
      - dom_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [hcl-net]

  # judgehost: DAEMON_ID = 이 judgehost가 혼자 쓰는 CPU 코어 번호 (SYSTEM_CPUS 와 겹치면 안 됨)
  #            RUN_USER_UID_GID = 62860 + DAEMON_ID
  # 우리 서버(ai.walab.info): 물리 코어 4~12 에 하나씩 (9개). 하이퍼스레드 짝(28~36)은 비워 두어 채점 시간을 안정시킨다.
  judgehost-1:
    <<: *judgehost
    hostname: judgehost-1
    environment:
      <<: *judgehost-env
      DAEMON_ID: "4"
      RUN_USER_UID_GID: "62864"

  judgehost-2:
    <<: *judgehost
    hostname: judgehost-2
    environment:
      <<: *judgehost-env
      DAEMON_ID: "5"
      RUN_USER_UID_GID: "62865"

  judgehost-3:
    <<: *judgehost
    hostname: judgehost-3
    environment:
      <<: *judgehost-env
      DAEMON_ID: "6"
      RUN_USER_UID_GID: "62866"

  judgehost-4:
    <<: *judgehost
    hostname: judgehost-4
    environment:
      <<: *judgehost-env
      DAEMON_ID: "7"
      RUN_USER_UID_GID: "62867"

  judgehost-5:
    <<: *judgehost
    hostname: judgehost-5
    environment:
      <<: *judgehost-env
      DAEMON_ID: "8"
      RUN_USER_UID_GID: "62868"

  judgehost-6:
    <<: *judgehost
    hostname: judgehost-6
    environment:
      <<: *judgehost-env
      DAEMON_ID: "9"
      RUN_USER_UID_GID: "62869"

  judgehost-7:
    <<: *judgehost
    hostname: judgehost-7
    environment:
      <<: *judgehost-env
      DAEMON_ID: "10"
      RUN_USER_UID_GID: "62870"

  judgehost-8:
    <<: *judgehost
    hostname: judgehost-8
    environment:
      <<: *judgehost-env
      DAEMON_ID: "11"
      RUN_USER_UID_GID: "62871"

  judgehost-9:
    <<: *judgehost
    hostname: judgehost-9
    environment:
      <<: *judgehost-env
      DAEMON_ID: "12"
      RUN_USER_UID_GID: "62872"

  # ---------- 테스트하기 경량 실행기 (H-CodeLab_TestRun) ----------
  # backend 의 depends_on 에 넣지 않는다: 실행기가 멈춰도 backend 는 떠야 하고, 테스트하기는 DOMjudge 경로로 넘어간다.
  testrun-service:
    image: hcl-testrun-service:latest
    restart: unless-stopped
    cpuset: "${SYSTEM_CPUS}"
    environment:
      TZ: Asia/Seoul
      TESTRUN_DB_URL: jdbc:mariadb://web-db:3306/testrun
      TESTRUN_DB_USERNAME: testrun_svc
      TESTRUN_DB_PASSWORD: ${TESTRUN_DB_PASSWORD}
      TESTRUN_SERVICE_TOKEN: ${TESTRUN_SERVICE_TOKEN}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      web-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [hcl-net]

  # RUNNER_CPUS: 슬롯마다 혼자 쓰는 CPU 코어. judgehost(4-12)·SYSTEM_CPUS 와 겹치면 안 되고, 개수는 RUNNER_SLOTS 와 맞춘다.
  # judgehost 처럼 컨테이너에 cpuset 을 걸지 않고, 학생 코드만 runguard 가 해당 코어에 고정한다.
  testrun-runner:
    image: hcl-testrun-runner:latest
    restart: unless-stopped
    hostname: testrun-runner-1
    privileged: true
    cgroup: host
    environment:
      RUNNER_ID: runner-1
      RUNNER_SLOTS: ${RUNNER_SLOTS}
      RUNNER_CPUS: ${RUNNER_CPUS}
      RUNNER_JUDGE_MODE: direct
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DOMSERVER_BASEURL: http://domserver/domjudge/   # domserver WEBAPP_BASEURL 과 맞춘다
      DOMSERVER_USER: ${DOMJUDGE_API_USER}
      DOMSERVER_PASSWORD: ${DOMJUDGE_API_PASSWORD}
      HCL_INTERNAL_BASEURL: http://backend:8080/
      HCL_INTERNAL_TOKEN: ${TESTRUN_INTERNAL_TOKEN}
      CONTAINER_TIMEZONE: Asia/Seoul
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - testrun_testcases:/opt/domjudge/judgehost/judgings/testrun/testcases   # 테스트케이스 캐시 (재빌드해도 유지)
    depends_on:
      domserver:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [hcl-net]

volumes:
  web_db_data:
  dom_db_data:
  redis_data:
  domserver_etc:
  backend_logs:
  testrun_testcases:

networks:
  hcl-net:
    name: hcl-net
