# Jenkins 는 운영 스택(hcl)과 따로 띄운다. 배포 중에 Jenkins 자신이 재시작되지 않게 하기 위해서다.
# 실행: docker compose --env-file /home/codelab/hcl/.env -f /home/codelab/hcl/jenkins/docker-compose.yml up -d --build
name: hcl-jenkins

services:
  jenkins:
    build: .
    image: hcl-jenkins:latest
    restart: unless-stopped
    cpuset: "${SYSTEM_CPUS}"
    group_add:
      - "${DOCKER_GID}"
    ports:
      - "127.0.0.1:8080:8080"   # 화면: SSH 터널로만 접속
    environment:
      TZ: Asia/Seoul
      JAVA_OPTS: -Duser.timezone=Asia/Seoul
      SYSTEM_CPUS: ${SYSTEM_CPUS}
      DEPLOY_DIR: /home/codelab/hcl
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # 호스트와 같은 경로로 연결해야 compose 의 상대경로(./nginx 등)가 그대로 맞는다
      - /home/codelab/hcl:/home/codelab/hcl
      - /home/codelab/hcl-backup:/home/codelab/hcl-backup

volumes:
  jenkins_home:
