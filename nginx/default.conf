# HTTP 전용 설정 (도메인/HTTPS 없을 때). HTTPS 는 배포 매뉴얼 9단계 참고.

# Docker 내부 DNS. backend 컨테이너가 다시 만들어져 IP가 바뀌어도 10초 안에 따라간다.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;   # 문제 zip 업로드

    # HTTPS 인증서 발급용 (9단계)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # React 라우터: 없는 경로는 index.html 로
    location / {
        try_files $uri /index.html;
    }

    # 배포 직후 새 화면이 바로 보이도록 index.html 은 캐시하지 않는다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 빌드 파일은 이름에 해시가 붙어 있어 오래 캐시해도 된다
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 채점 결과 실시간 전송(SSE)이 끊기지 않도록
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
