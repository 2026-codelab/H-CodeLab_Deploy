# HTTPS 설정 (ai.walab.info). 인증서는 certbot/conf 에 있고, 발급·갱신은 배포 매뉴얼 9단계 참고.
# 새 서버에 처음 배포할 때는 인증서가 없어 nginx 가 켜지지 않으므로 9-1(인증서 발급)을 먼저 한다.

# Docker 내부 DNS. backend 컨테이너가 다시 만들어져 IP가 바뀌어도 10초 안에 따라간다.
resolver 127.0.0.11 valid=10s ipv6=off;

# http 로 들어오면 https 로 보낸다 (인증서 갱신 경로만 예외)
server {
    listen 80;
    server_name ai.walab.info;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.walab.info;

    ssl_certificate     /etc/letsencrypt/live/ai.walab.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.walab.info/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;   # 문제 zip 업로드

    # React 라우터: 없는 경로는 index.html 로
    location / {
        try_files $uri /index.html;
    }

    # 배포 직후 새 화면이 바로 보이도록 index.html 은 캐시하지 않는다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 빌드 파일은 이름에 해시가 붙어 있어 오래 캐시해도 된다
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # DOMjudge 관리자 화면 (DOMjudge 자체 로그인으로 보호)
    location = /domjudge {
        return 302 /domjudge/login;
    }

    # 로그인 없이 보이는 공개 스코어보드와 API 는 밖에서 막는다 (수업 이름·학생 결과 노출 방지).
    # backend 와 judgehost 는 nginx 를 거치지 않고 내부에서 domserver 에 직접 접속하므로 영향 없음.
    location = /domjudge/ {
        return 302 /domjudge/login;
    }

    location ^~ /domjudge/public {
        return 302 /domjudge/login;
    }

    location ^~ /domjudge/api/ {
        return 403;
    }

    location /domjudge/ {
        set $domjudge_upstream http://domserver;
        proxy_pass $domjudge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;   # 문제 zip 업로드 등 오래 걸리는 요청
    }

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 채점 결과 실시간 전송(SSE)이 끊기지 않도록
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
