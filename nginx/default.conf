# HCL 화면 + 내부 리버스 프록시. 서버에 직접 설치한 nginx(정문) 뒤에서 http 로만 동작한다.
# HTTPS 와 인증서는 서버 nginx 가 처리하고, 이 컨테이너는 127.0.0.1:8081 로만 열린다 (docker-compose.yml).

# Docker 내부 DNS. backend 컨테이너가 다시 만들어져 IP가 바뀌어도 10초 안에 따라간다.
resolver 127.0.0.11 valid=10s ipv6=off;

# 서버 nginx 가 보낸 실제 사용자 IP 를 쓴다 (서버 nginx 는 hcl-net 게이트웨이 주소로 들어온다)
set_real_ip_from 192.168.240.1;
real_ip_header X-Real-IP;

server {
    listen 80;
    server_name ai.walab.info;
    # 이동(301/302) 주소에 http:// 를 붙이지 않고 경로만 보낸다. 브라우저가 쓰던 https 를 그대로 이어 쓴다.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;   # 문제 zip 업로드

    # React 라우터: 없는 경로는 index.html 로
    location / {
        try_files $uri /index.html;
    }

    # 배포 직후 새 화면이 바로 보이도록 index.html 은 캐시하지 않는다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 빌드 파일은 이름에 해시가 붙어 있어 오래 캐시해도 된다
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # DOMjudge 관리자 화면 (DOMjudge 자체 로그인으로 보호)
    location = /domjudge {
        return 301 /domjudge/;
    }

    # 로그인 없이 보이는 공개 스코어보드와 API 는 밖에서 막는다 (수업 이름·학생 결과 노출 방지).
    # backend 와 judgehost 는 nginx 를 거치지 않고 내부에서 domserver 에 직접 접속하므로 영향 없음.
    # /domjudge/ 자체는 막지 않는다: 로그인 후 DOMjudge 가 이 주소로 보내므로 막으면 리디렉션이 무한 반복된다.
    # (로그인 안 한 사람은 DOMjudge 가 /domjudge/public 으로 보내고, 아래 규칙이 다시 로그인 화면으로 보낸다)
    location ^~ /domjudge/public {
        return 302 /domjudge/login;
    }

    location ^~ /domjudge/api/ {
        return 403;
    }

    # 사용자는 https 로 접속하므로, 서버 nginx 가 알려 준 원래 프로토콜·포트를 그대로 넘긴다
    location /domjudge/ {
        set $domjudge_upstream http://domserver;
        proxy_pass $domjudge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;   # 문제 zip 업로드 등 오래 걸리는 요청
    }

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";

        # 채점 결과 실시간 전송(SSE)이 끊기지 않도록
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
